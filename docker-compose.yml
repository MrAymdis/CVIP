services:
  postgres:
    image: postgres:16-alpine
    container_name: cve-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvepassword}
      POSTGRES_DB: ${POSTGRES_DB:-cve_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cve} -d ${POSTGRES_DB:-cve_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cve-redis
    # Remove port mapping to avoid conflicts
    # ports:
    #   - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cve-backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cve}:${POSTGRES_PASSWORD:-cvepassword}@postgres:5432/${POSTGRES_DB:-cve_db}
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=${DEBUG:-False}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cve-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8006
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  redis_data:
